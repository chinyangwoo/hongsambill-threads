name: 스레드 자동 포스팅

on:
  schedule:
    # KST 기준 하루 3회 (GitHub cron 은 UTC 기준)
    - cron: "0 23 * * *"   # 오전 08:00 KST
    - cron: "30 3 * * *"   # 낮 12:30 KST
    - cron: "0 10 * * *"   # 저녁 19:00 KST
  workflow_dispatch: {}     # 수동 실행 버튼 (테스트용)

permissions:
  contents: write           # posted_log.json 커밋용

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install pynacl

      - name: 스레드 포스팅 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python threads_auto_post.py

      - name: 포스팅 기록 저장
        run: |
          git config user.name "threads-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted_log.json .token_meta.json || true
          git diff --cached --quiet || git commit -m "🤖 포스팅 기록 업데이트"
          git push
