name: 스레드 자동 포스팅

on:
  # 정해진 시각 발행은 SNS 창고(Supabase pg_cron)가 workflow_dispatch 로 신호를 보낸다 (2026-11-01 전환).
  # 되돌리려면 이 자리에 예전 schedule: 블록을 되살리면 된다.
  workflow_dispatch:        # 수동 실행 또는 SNS 창고(pg_cron)의 정시 신호
    inputs:
      slot:
        description: "회차 1~3 (0 = 한국시간으로 자동 판단)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write          # posted_log.json 커밋용

# 인스타·페이스북·성수주조장 워크플로와 같은 그룹으로 묶어
# 저장소에 기록을 저장하는 작업이 한 번에 하나씩만 돌도록 줄 세우기
concurrency:
  # 발행 3개(스레드·인스타·페북)만 쓰는 전용 줄. 예전에는 11개 작업이 한 줄을 같이 써서,
  # 다른 작업이 오래 걸리면 기다리던 발행이 뒤에 온 작업에 밀려 취소됐다 (2026-11-05 08:30 스레드 누락).
  group: sns-publish-hotel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install pynacl

      - name: 스레드 포스팅 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SLOT: ${{ inputs.slot }}
          SNS_WRITE_SECRET: ${{ secrets.SNS_WRITE_SECRET }}
        run: python threads_auto_post.py

      - name: 포스팅 기록 저장
        run: |
          git config user.name "threads-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted_log.json .token_meta.json || true
          git diff --cached --quiet || git commit -m "🤖 포스팅 기록 업데이트"
          # 다른 워크플로가 먼저 커밋했어도 밀리지 않도록
          # 최신 내용을 먼저 받아온 뒤(pull --rebase) 푸시, 실패하면 최대 5번 재시도
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "푸시 실패 ($i/5) — 10초 후 재시도"
            sleep 10
          done
