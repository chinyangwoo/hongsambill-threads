# 저장 위치: .github/workflows/instagram.yml
# 한국시간 09:17 / 13:23 / 19:47 (정각·30분은 GitHub 예약 지연이 심해 애매한 분으로 배치)
name: 인스타그램 자동 포스팅

on:
  # 정해진 시각 발행은 SNS 창고(Supabase pg_cron)가 workflow_dispatch 로 신호를 보낸다 (2026-11-01 전환).
  # 되돌리려면 이 자리에 예전 schedule: 블록을 되살리면 된다.
  workflow_dispatch:        # 수동 실행 또는 SNS 창고(pg_cron)의 정시 신호
    inputs:
      slot:
        description: "회차 1~3 (0 = 한국시간으로 자동 판단)"
        required: false
        default: "0"
        type: string

# 스레드 워크플로와 동시에 커밋 충돌 방지
concurrency:
  # 발행 3개(스레드·인스타·페북)만 쓰는 전용 줄. 예전에는 11개 작업이 한 줄을 같이 써서,
  # 다른 작업이 오래 걸리면 기다리던 발행이 뒤에 온 작업에 밀려 취소됐다 (2026-11-05 08:30 스레드 누락).
  group: sns-publish-hotel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pynacl pillow

      - name: 인스타그램 게시
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SLOT: ${{ inputs.slot }}
          SNS_WRITE_SECRET: ${{ secrets.SNS_WRITE_SECRET }}
        run: python instagram_auto_post.py

      - name: 게시 기록 저장
        if: always()
        run: |
          git config user.name "auto-post-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A ig_cache instagram_posted_log.json .ig_token_meta.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "인스타 게시 기록 $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin ${{ github.ref_name }} && git push && break
            echo "푸시 실패 ($i/5) — 10초 후 재시도"; sleep 10
          done
