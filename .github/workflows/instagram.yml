# 저장 위치: .github/workflows/instagram.yml
# 한국시간 09:00 / 13:30 / 20:00 (스레드 시간표와 겹치지 않게 1시간 어긋나게 배치)
name: 인스타그램 자동 포스팅

on:
  schedule:
    - cron: "0 0 * * *"    # KST 09:00
    - cron: "30 4 * * *"   # KST 13:30
    - cron: "0 11 * * *"   # KST 20:00
  workflow_dispatch:       # Actions 탭에서 수동 실행 버튼

# 스레드 워크플로와 동시에 커밋 충돌 방지
concurrency:
  group: auto-post-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pynacl pillow

      - name: 인스타그램 게시
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python instagram_auto_post.py

      - name: 게시 기록 저장
        if: always()
        run: |
          git config user.name "auto-post-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A ig_cache instagram_posted_log.json .ig_token_meta.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "인스타 게시 기록 $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || true
