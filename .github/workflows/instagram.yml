# 저장 위치: .github/workflows/instagram.yml
# 한국시간 09:17 / 13:23 / 19:47 (정각·30분은 GitHub 예약 지연이 심해 애매한 분으로 배치)
name: 인스타그램 자동 포스팅

on:
  schedule:
    - cron: "17 21 * * *"   # KST 06:17
    - cron: "23 1 * * *"   # KST 10:23
    - cron: "47 7 * * *"  # KST 16:47
  workflow_dispatch:        # 수동 실행 또는 SNS 창고(pg_cron)의 정시 신호
    inputs:
      slot:
        description: "회차 1~3 (0 = 한국시간으로 자동 판단)"
        required: false
        default: "0"
        type: string

# 스레드 워크플로와 동시에 커밋 충돌 방지
concurrency:
  group: auto-post-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pynacl pillow

      - name: 인스타그램 게시
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SLOT: ${{ inputs.slot }}
          SNS_WRITE_SECRET: ${{ secrets.SNS_WRITE_SECRET }}
        run: python instagram_auto_post.py

      - name: 게시 기록 저장
        if: always()
        run: |
          git config user.name "auto-post-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A ig_cache instagram_posted_log.json .ig_token_meta.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "인스타 게시 기록 $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || true
