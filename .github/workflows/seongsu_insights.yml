# 성수주조장 인스타 성과 수집 — 매일 KST 10:00 (UTC 01:00)
# 전날 11:00 / 18:00 게시물의 조회·도달·좋아요·댓글·저장을 seongsu_instagram_insights.json 에 기록
name: 성수주조장 인스타 성과 수집

on:
  schedule:
    - cron: "0 1 * * *"           # 매일 KST 10:00
  workflow_dispatch:

concurrency:
  group: auto-post-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 성과 수집
        env:
          SEONGSU_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.SEONGSU_INSTAGRAM_ACCESS_TOKEN }}
        run: python seongsu_instagram_insights.py

      - name: 결과 저장
        if: always()
        run: |
          git config user.name "auto-post-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A seongsu_instagram_insights.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "성수주조장 인스타 성과 $(date -u +'%Y-%m-%d')"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || true
