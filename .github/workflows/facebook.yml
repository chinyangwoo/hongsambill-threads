# 저장 위치: .github/workflows/facebook.yml
# 한국시간 07:23 / 17:23 하루 2회 (페이스북은 1~2회가 적정)
name: 페이스북 자동 포스팅

on:
  # 정해진 시각 발행은 SNS 창고(Supabase pg_cron)가 workflow_dispatch 로 신호를 보낸다 (2026-11-01 전환).
  # 되돌리려면 이 자리에 예전 schedule: 블록을 되살리면 된다.
  workflow_dispatch:        # 수동 실행 또는 SNS 창고(pg_cron)의 정시 신호
    inputs:
      slot:
        description: "회차 1~3 (0 = 한국시간으로 자동 판단)"
        required: false
        default: "0"
        type: string

concurrency:
  group: auto-post-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pynacl pillow

      - name: 페이스북 게시
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SLOT: ${{ inputs.slot }}
          SNS_WRITE_SECRET: ${{ secrets.SNS_WRITE_SECRET }}
        run: python facebook_auto_post.py

      - name: 게시 기록 저장
        if: always()
        run: |
          git config user.name "auto-post-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A fb_cache facebook_posted_log.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "페북 게시 기록 $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || true
