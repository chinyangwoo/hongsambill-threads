# 저장 위치: .github/workflows/facebook.yml
# 한국시간 10:00 / 14:30 / 21:00 (스레드·인스타와 겹치지 않게 배치)
name: 페이스북 자동 포스팅

on:
  schedule:
    - cron: "0 1 * * *"    # KST 10:00
    - cron: "30 5 * * *"   # KST 14:30
    - cron: "0 12 * * *"   # KST 21:00
  workflow_dispatch:

concurrency:
  group: auto-post-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pynacl pillow

      - name: 페이스북 게시
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python facebook_auto_post.py

      - name: 게시 기록 저장
        if: always()
        run: |
          git config user.name "auto-post-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A fb_cache facebook_posted_log.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "페북 게시 기록 $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || true
