# 홍보 대시보드 — SNS 성과 수집 (하루 2회). AI 인용 점검은 대표 요청으로 중단 (2026-10-16)
# 결과는 metrics/*.json 에 저장되고, Supabase 가 30분마다 읽어 대시보드에 반영합니다.
name: 홍보 대시보드 수집

on:
  schedule:
    - cron: "53 23 * * *"   # KST 08:53 — SNS 성과
    - cron: "53 11 * * *"   # KST 20:53 — SNS 성과
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [metrics_collect.py, ai_citation_check.py, ai_questions.json, .github/workflows/metrics.yml]

concurrency:
  group: auto-post-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SNS 성과 수집
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          SEONGSU_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.SEONGSU_INSTAGRAM_ACCESS_TOKEN }}
          SEONGSU_INSTAGRAM_USER_ID: ${{ secrets.SEONGSU_INSTAGRAM_USER_ID }}
        run: python metrics_collect.py threads_hotel fb_hotel ig_hotel ig_seongsu

      - name: 결과 저장
        if: always()
        run: |
          git config user.name "metrics-bot"
          git config user.email "bot@users.noreply.github.com"
          git add metrics/ || true
          git diff --cached --quiet && exit 0
          git commit -m "📊 홍보 대시보드 수치 $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "푸시 실패 ($i/5) — 10초 후 재시도"; sleep 10
          done
