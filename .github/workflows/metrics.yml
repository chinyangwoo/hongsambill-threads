# 홍보 성과판 — SNS·블로그 성과 매시간 수집, AI 검색 점검 하루 1회(업장별 질문 1개씩)
# 결과는 metrics/*.json 에 저장되고, Supabase 가 30분마다 읽어 성과판에 반영합니다.
name: 홍보 대시보드 수집

on:
  schedule:
    - cron: "7 * * * *"     # 매시간 7분 — SNS·블로그 성과
    - cron: "37 0 * * *"    # KST 09:37 — AI 검색 점검
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [metrics_collect.py, blog_collect.py, ai_citation_check.py, ai_questions.json, .github/workflows/metrics.yml]

concurrency:
  group: auto-post-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SNS 성과 수집
        if: github.event.schedule != '37 0 * * *'
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          SEONGSU_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.SEONGSU_INSTAGRAM_ACCESS_TOKEN }}
          SEONGSU_INSTAGRAM_USER_ID: ${{ secrets.SEONGSU_INSTAGRAM_USER_ID }}
        run: python metrics_collect.py threads_hotel fb_hotel ig_hotel ig_seongsu

      - name: 블로그 성과 수집
        if: github.event.schedule != '37 0 * * *'
        continue-on-error: true
        run: python blog_collect.py

      - name: AI 검색 점검
        if: github.event.schedule == '37 0 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python ai_citation_check.py

      - name: 결과 저장
        if: always()
        run: |
          git config user.name "metrics-bot"
          git config user.email "bot@users.noreply.github.com"
          git add metrics/ || true
          git diff --cached --quiet && exit 0
          git commit -m "📊 홍보 대시보드 수치 $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "푸시 실패 ($i/5) — 10초 후 재시도"; sleep 10
          done
